name: Deploy to Dev Server

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

jobs:
  deploy:
    name: Deploy to cPanel via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # (Optional) Show runner IP to whitelist if server blocks FTP (cPHulk/Imunify)
      - name: Show runner public IP
        run: |
          echo "IPv4: $(curl -s https://api.ipify.org)"
          echo "IPv6: $(curl -s https://api64.ipify.org)"

      # Preflight: verify FTPS auth + dir access from the runner
      - name: Preflight FTPS login (PWD + list target dir)
        run: |
          set -eu
          echo "Testing FTPS login to ${FTP_HOST} as ${FTP_USERNAME} ..."
          curl -v --ssl-reqd \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            "ftp://${FTP_HOST}:21/${FTP_TARGET_DIR}/" \
            --quote "PWD"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}              # e.g., host23.name.am
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}      # main cPanel user (no @domain)
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}      # same as 2083 login
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}  # e.g., /dev

      - name: Deploy to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}               # host23.name.am recommended
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps                                # Explicit TLS
          port: 21
          local-dir: ./build/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}/    # /dev
          log-level: verbose
          timeout: 60000
          # If you use ftp.ethery.tech and see TLS mismatch, uncomment the next line:
          # security: loose
          exclude: |
            **/.git*
            **/.DS_Store
