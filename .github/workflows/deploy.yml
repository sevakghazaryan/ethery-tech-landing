name: Deploy to Dev Server

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

jobs:
  deploy:
    name: Deploy to cPanel via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # 🔍 Preflight: prove FTPS auth & directory access from the runner
      - name: Preflight FTPS login (PWD + list target dir)
        run: |
          set -eu
          echo "Testing FTPS login to ${FTP_HOST} as ${FTP_USERNAME} ..."
          # Ask server for current directory and try to list target dir
          curl -v --ssl-reqd \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            "ftp://${FTP_HOST}:21/${FTP_TARGET_DIR}/" \
            --quote "PWD" || exit 1
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}

      - name: Deploy to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./build/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}/
          log-level: verbose
          timeout: 60000
          exclude: |
            **/.git*
            **/.DS_Store