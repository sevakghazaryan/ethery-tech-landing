name: Deploy to Dev Server (SFTP only)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

jobs:
  deploy:
    name: Deploy to cPanel via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build   # For Next.js static export: next build && next export (then change build/ to out/ below)

      # Add server host key so SFTP is strict but non-interactive
      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      # Write the private key (no passphrase) for SFTP
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      # 🔍 Preflight: SFTP can list the target dir (note: unquoted EOF so ${...} expands)
      - name: Preflight SFTP (list target dir)
        run: |
          sftp -i ~/.ssh/id_ci -oBatchMode=yes -P "${SSH_PORT}" \
               -oStrictHostKeyChecking=yes -oUserKnownHostsFile=~/.ssh/known_hosts \
               "${SSH_USER}@${SSH_HOST}" <<EOF
          ls -la ${REMOTE_DEV_PATH}
          EOF
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DEV_PATH: ${{ secrets.REMOTE_DEV_PATH }}

      # 🚀 Upload build/ recursively via pure SFTP (no shell)
      - name: Deploy via SFTP (recursive put)
        run: |
          # change LOCAL_DIR to ./out if you used next export
          LOCAL_DIR="./build"
          # ensure path exists (mkdir will error if it exists, that's fine)
          sftp -i ~/.ssh/id_ci -oBatchMode=yes -P "${SSH_PORT}" \
               -oStrictHostKeyChecking=yes -oUserKnownHostsFile=~/.ssh/known_hosts \
               "${SSH_USER}@${SSH_HOST}" <<EOF
          mkdir ${REMOTE_DEV_PATH}
          cd ${REMOTE_DEV_PATH}
          put -r ${LOCAL_DIR}/*
          EOF
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DEV_PATH: ${{ secrets.REMOTE_DEV_PATH }}
