name: Deploy to Dev Server

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

jobs:
  deploy:
    name: Deploy to cPanel via SFTP/SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build    # change to `next build && next export` and upload ./out/ if using Next.js static export

      # Add server host key so SSH remains strict but non-interactive
      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      # Preflight: confirm SSH works and target dir exists
      - name: Preflight SSH
        run: |
          set -e
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${SSH_PRIVATE_KEY}"
          ssh -o BatchMode=yes -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "\
            echo 'Connected as:' \$(whoami) && \
            echo 'Ensuring target dir…' && mkdir -p '${REMOTE_DEV_PATH}' && \
            ls -lad '${REMOTE_DEV_PATH}'"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_DEV_PATH: ${{ secrets.REMOTE_DEV_PATH }}

      # Deploy using rsync over SSH (fast deltas, removes deleted files)
      - name: Rsync deploy
        run: |
          set -e
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${SSH_PRIVATE_KEY}"
          SRC_DIR="./build/"         # if using Next.js export, set to ./out/
          TARGET="${REMOTE_DEV_PATH%/}"
          rsync -az --delete \
            --chmod=D755,F644 \
            --exclude='.git*' --exclude='.DS_Store' \
            -e "ssh -p ${SSH_PORT}" \
            "$SRC_DIR" "${SSH_USER}@${SSH_HOST}:${TARGET}/"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_DEV_PATH: ${{ secrets.REMOTE_DEV_PATH }}
