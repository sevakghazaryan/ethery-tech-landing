name: Deploy to Production Server (SFTP only)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Production deployment'

jobs:
  deploy:
    name: Deploy to Production via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Clean remote directory via SFTP (no shell access required)
        run: |
          # Create SFTP batch script to remove old files/folders
          # Note: Preserves api/ folder (important backend API)
          cat > sftp_cleanup.txt << EOF
          cd ${REMOTE_PROD_PATH}
          -rm blog
          -rm COPYRIGHT
          -rm css
          -rm favi
          -rm font-awesome
          -rm fonts
          -rm img
          -rm js
          -rm pricing
          -rm product-Item
          -rm services
          -rm solution-item
          -rm templates
          -rm LICENSE.txt
          -rm phpinfo.php
          -rm index.txt
          -rm 404.html
          -rmdir blog
          -rmdir COPYRIGHT
          -rmdir css
          -rmdir favi
          -rmdir font-awesome
          -rmdir fonts
          -rmdir img
          -rmdir js
          -rmdir pricing
          -rmdir product-Item
          -rmdir services
          -rmdir solution-item
          -rmdir templates
          quit
          EOF
          
          echo "🗑️ Cleaning old files via SFTP..."
          echo "Target directory: ${REMOTE_PROD_PATH}"
          echo "⚠️  Preserving: .htaccess, cgi-bin, .well-known, api/"
          sftp -i ~/.ssh/id_ci -oBatchMode=yes -oStrictHostKeyChecking=no -P "${SSH_PORT}" -b sftp_cleanup.txt "${SSH_USER}@${SSH_HOST}" || true
          echo "✅ Cleanup complete (errors for non-existent files are OK)"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_PROD_PATH: ${{ secrets.REMOTE_PROD_PATH }}

      - name: Deploy via SFTP (recursive put)
        run: |
          LOCAL_DIR="./build"   # change to ./out if you used Next.js export
          {
            echo "mkdir ${REMOTE_PROD_PATH}";
            echo "cd ${REMOTE_PROD_PATH}";
            echo "put -r ${LOCAL_DIR}/*";
          } | sftp -i ~/.ssh/id_ci -oBatchMode=yes -oStrictHostKeyChecking=no -P "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}                 # e.g., host23.name.am
          SSH_PORT: ${{ secrets.SSH_PORT }}                 # 22
          SSH_USER: ${{ secrets.SSH_USER }}                 # cPanel username (e.g., etheryadmin)
          REMOTE_PROD_PATH: ${{ secrets.REMOTE_PROD_PATH }}   # absolute docroot, e.g., /home2/etheryadmin/public_html
