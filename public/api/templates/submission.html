<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{heading}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f7fb;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f7fb;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:640px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e6ebf2;">
          <tr>
            <td style="background:#0b1b33;padding:20px 24px;">
              <span style="font:700 18px/24px Arial,Helvetica,sans-serif;color:#ffffff;">Ethery Tech</span>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 24px 8px 24px;">
              <h1 style="margin:0 0 6px 0;font:700 20px/28px Arial,Helvetica,sans-serif;color:#0b1b33;">{{heading}}</h1>
              <p style="margin:0;font:400 14px/20px Arial,Helvetica,sans-serif;color:#5b6b82;">{{intro}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 8px 8px 8px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
                {{rows}}
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 24px 24px 24px;">
              <p style="margin:0;font:400 12px/18px Arial,Helvetica,sans-serif;color:#8798ad;">
                Submitted {{submitted_at}} from ethery.tech &middot; reply directly to this email to reach the sender.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
